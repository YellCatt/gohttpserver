name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']      # 加上 tag 触发，这样 VERSION 才能取到 tag 名
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - os: linux
            arch: amd64
            suffix: linux_amd64
            goflags: GOOS=linux GOARCH=amd64
          - os: linux
            arch: arm64
            suffix: linux_arm64
            goflags: GOOS=linux GOARCH=arm64
          - os: darwin
            arch: amd64
            suffix: darwin_amd64
            goflags: GOOS=darwin GOARCH=amd64
          - os: darwin
            arch: arm64
            suffix: darwin_arm64
            goflags: GOOS=darwin GOARCH=arm64
          - os: windows
            arch: amd64
            suffix: windows_amd64
            goflags: GOOS=windows GOARCH=amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Fix go modules
        run: |
          go clean -modcache
          go mod tidy

      - name: Build for ${{ matrix.target.os }}/${{ matrix.target.arch }}
        env:
          GITCOMMIT: ${{ github.sha }}
          BUILDTIME: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        run: |
          VERSION="dev"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${{ github.ref_name }}
          fi
          EXT=""
          if [ "${{ matrix.target.os }}" = "windows" ]; then
            EXT=".exe"
          fi
          LDFLAGS="-s -w -X main.VERSION=${VERSION} -X main.BUILDTIME=${BUILDTIME} -X main.GITCOMMIT=${GITCOMMIT}"
          ${{ matrix.target.goflags }} go build -ldflags="${LDFLAGS}" -o "gohttpserver_${{ matrix.target.suffix }}${EXT}"
          ls -la gohttpserver_*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gohttpserver_${{ matrix.target.suffix }}
          path: gohttpserver_${{ matrix.target.suffix }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Create or Update Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            gh release create "$VERSION" \
              --title "Release $VERSION" \
              --generate-notes \
              artifacts/*
          else
            VERSION="dev-latest"
            gh release delete "$VERSION" --yes 2>/dev/null || true
            gh release create "$VERSION" \
              --title "Development Build (Latest)" \
              --notes "Automatic build from commit ${{ github.sha }}" \
              --prerelease \
              artifacts/*
          fi